<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HSK 3.0 · Từ vựng tổng hợp HSK 2 — Hán Ngữ Lâm Hoa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Noto+Serif+SC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --green-deep:#134429;
  --green-deep-2:#1c5a37;
  --green-mid:#3f8f5f;
  --green-soft:#7bb98a;
  --green-pale:#d3e6d6;
  --cream:#e9efe1;
  --cream-2:#dfe9d3;
  --card:#ffffff;
  --red:#b3271e;
  --red-soft:#e9d3cf;
  --yellow:#dd9c2e;
  --ink:#1e2a22;
  --ink-soft:#5a6b5f;
  --line:#dfe8dd;
  --shadow: 0 10px 28px -14px rgba(19,68,41,0.28);
  --radius: 18px;
  box-sizing:border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
*,*::before,*::after{box-sizing:inherit;}
html{scroll-padding-top: env(safe-area-inset-top, 0px);}
html,body{height:100%;}
body{
  margin:0;
  background: var(--cream);
  color:var(--ink);
  font-family:'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  -webkit-font-smoothing:antialiased;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --cream:#0f1712; --cream-2:#131d16; --card:#17241b; --ink:#e9f1ea; --ink-soft:#9db3a4;
    --line:#25352a; --green-pale:#1b2c20; --red-soft:#3a221f;
  }
}
:root[data-theme="dark"]{
  --cream:#0f1712; --cream-2:#131d16; --card:#17241b; --ink:#e9f1ea; --ink-soft:#9db3a4;
  --line:#25352a; --green-pale:#1b2c20; --red-soft:#3a221f;
}
.hanzi-font{ font-family:'Noto Serif SC', 'PingFang SC','Microsoft YaHei', serif; }
img{max-width:100%; display:block;}

/* ---------- Layout shell ---------- */
.page{ max-width:1080px; margin:0 auto; padding:0 18px 64px; }

/* ---------- Header ---------- */
.site-header{
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(120% 90% at 85% -10%, var(--green-pale) 0%, transparent 55%),
    linear-gradient(180deg, var(--cream-2) 0%, var(--cream) 100%);
  border-bottom:3px solid var(--green-deep-2);
}
.header-topbar{
  height:9px;
  background:linear-gradient(90deg, var(--green-deep) 0%, var(--green-mid) 45%, var(--green-soft) 75%, var(--green-pale) 100%);
}
.watermark-logo{
  position:absolute;
  right:-30px; top:50%; transform:translateY(-50%);
  width:360px; opacity:0.16; pointer-events:none;
}
.dot-texture{
  position:absolute; left:-30px; bottom:-30px; width:220px; height:220px;
  background-image: radial-gradient(var(--green-soft) 1.6px, transparent 1.6px);
  background-size: 16px 16px;
  opacity:.18; pointer-events:none;
}
.header-inner{ position:relative; max-width:1080px; margin:0 auto; padding:22px 18px 30px; }
.header-top-row{
  display:flex; align-items:center; justify-content:center; gap:22px;
  flex-wrap:wrap; text-align:center;
}
.brand-logo{ width:56px; height:56px; border-radius:12px; flex:none; }
.brand-center{ display:flex; flex-direction:column; gap:4px; align-items:center; }
.brand-name{
  font-weight:800; font-size:1.05rem; letter-spacing:.02em;
  color:var(--red); text-transform:uppercase;
}
.brand-contact{
  display:flex; gap:10px; flex-wrap:wrap; justify-content:center;
  font-size:.78rem; color:var(--ink-soft); font-weight:500;
}
.brand-contact .sep{opacity:.5;}
.brand-qr{ display:flex; flex-direction:column; align-items:center; gap:4px; flex:none; }
.brand-qr img{ width:64px; height:64px; border-radius:8px; border:1px solid var(--line); padding:3px; background:#fff; }
.brand-qr span{ font-size:.68rem; color:var(--ink-soft); }
.header-title-row{ text-align:center; margin-top:26px; }
.big-title{
  margin:0; font-family:'Noto Serif SC','Be Vietnam Pro',serif; font-weight:900;
  line-height:1.15; display:flex; flex-direction:column; align-items:center; gap:4px;
}
.big-title .title-line-1{
  color:var(--green-mid); font-size:clamp(1.05rem, 2.4vw, 1.5rem); letter-spacing:.04em;
}
.big-title .title-line-2{
  color:var(--red); font-size:clamp(1.7rem, 4.6vw, 2.9rem);
}
.header-subtitle{
  margin:12px auto 0; max-width:520px; color:var(--ink-soft);
  font-size:.98rem; font-weight:500;
}

/* ---------- Lesson nav ---------- */
.lesson-nav-wrap{ position:sticky; top:0; z-index:20; background:var(--cream); padding-top:14px; padding-bottom:4px; border-bottom:1px solid var(--line);}
.lesson-nav{
  display:flex; gap:8px; overflow-x:auto; padding:2px 2px 12px;
  scrollbar-width: thin;
}
.lesson-pill{
  flex:none; border:1.5px solid var(--line); background:var(--card); color:var(--ink);
  padding:8px 16px; border-radius:999px; font-weight:600; font-size:.86rem;
  cursor:pointer; transition:.15s; white-space:nowrap;
}
.lesson-pill:hover{ border-color:var(--green-soft); }
.lesson-pill.active{ background:var(--green-deep); border-color:var(--green-deep); color:#fff; }

/* ---------- Part tabs ---------- */
.part-tabs{ display:flex; gap:10px; margin:20px 0 6px; flex-wrap:wrap; }
.part-tab{
  flex:1 1 160px; border:1.5px solid var(--line); background:var(--card);
  border-radius:14px; padding:12px 14px; cursor:pointer; text-align:left;
  transition:.15s; font-family:inherit;
}
.part-tab b{ display:block; font-size:.92rem; color:var(--ink); }
.part-tab span{ display:block; font-size:.74rem; color:var(--ink-soft); margin-top:2px; }
.part-tab.active{ border-color:var(--green-mid); background:var(--green-pale); box-shadow:var(--shadow); }
.part-tab.active b{ color:var(--green-deep); }

.part-content{ margin-top:18px; min-height:420px; }

/* ---------- Generic card ---------- */
.panel{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:26px 20px;
}

/* ============ PART 1: Flashcard ============ */
.flash-wrap{ max-width:420px; margin:0 auto; }
.flash-progress{ text-align:center; font-size:.82rem; color:var(--ink-soft); font-weight:600; margin-bottom:14px; }
.flash-card{
  perspective:1400px; height:300px; cursor:pointer; user-select:none;
}
.flash-card-inner{
  position:relative; width:100%; height:100%; transition:transform .5s cubic-bezier(.4,.2,.2,1);
  transform-style:preserve-3d;
}
.flash-card.flipped .flash-card-inner{ transform:rotateY(180deg); }
.flash-face{
  position:absolute; inset:0; backface-visibility:hidden; border-radius:22px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:20px; text-align:center; border:1.5px solid var(--line); box-shadow:var(--shadow);
}
.flash-front{ background:linear-gradient(160deg,#ffffff, var(--green-pale)); }
.flash-front .fh{ font-size:5.2rem; font-weight:700; color:var(--green-deep); line-height:1; }
.flash-hint{ margin-top:16px; font-size:.75rem; color:var(--ink-soft); }
.flash-back{ background:linear-gradient(160deg, var(--green-deep), var(--green-deep-2)); color:#fff; transform:rotateY(180deg); }
.flash-back .fp{ font-size:1.7rem; font-weight:700; color:#e9f7ee; }
.flash-back .fl{ font-size:.78rem; color:#bfe0cb; margin-top:4px; font-weight:600; }
.flash-back .fv{ font-size:1.25rem; margin-top:14px; font-weight:600; line-height:1.4; }
.speak-btn{
  position:absolute; top:14px; right:14px; width:34px; height:34px; border-radius:50%;
  border:1px solid var(--line); background:#fff; display:flex; align-items:center; justify-content:center;
  cursor:pointer; font-size:1rem; z-index:2;
}
.flash-controls{ display:flex; align-items:center; justify-content:center; gap:18px; margin-top:20px; }
.nav-btn{
  width:44px; height:44px; border-radius:50%; border:1.5px solid var(--line); background:var(--card);
  font-size:1.1rem; cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--green-deep);
  transition:.15s;
}
.nav-btn:hover{ border-color:var(--green-mid); background:var(--green-pale); }
.nav-btn:disabled{ opacity:.35; cursor:default; }
.flash-counter{ font-weight:700; color:var(--ink-soft); font-size:.85rem; min-width:56px; text-align:center; }

/* ============ PART 2: Writing practice ============ */
.write-wrap{ max-width:420px; margin:0 auto; text-align:center; }
.write-meta{ margin-bottom:16px; }
.write-pinyin{ font-size:1.55rem; font-weight:700; color:var(--green-deep); }
.write-loai{ display:inline-block; font-size:.68rem; font-weight:700; color:var(--green-mid); background:var(--green-pale); border-radius:6px; padding:1px 7px; margin-left:6px; vertical-align:middle; }
.write-nghia{ font-size:1.02rem; color:var(--ink-soft); font-weight:600; margin-top:4px; }

.write-grid-row{
  display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:0 auto;
  max-width:100%;
}
.write-cell{
  position:relative; border:2px solid var(--green-mid); border-radius:14px; background:#fff; overflow:hidden;
  background-image:
    linear-gradient(var(--line) 1px, transparent 1px),
    linear-gradient(90deg, var(--line) 1px, transparent 1px),
    linear-gradient(45deg, var(--line) 1px, transparent 1px),
    linear-gradient(-45deg, var(--line) 1px, transparent 1px);
  background-size: 100% 100%, 100% 100%, 141% 141%, 141% 141%;
  background-position: center, center, center, center;
  background-repeat:no-repeat;
  flex:none;
}
.write-target{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }

.write-buttons{ display:flex; gap:8px; justify-content:center; margin-top:18px; flex-wrap:wrap; }
.wbtn{
  border:none; border-radius:12px; padding:11px 14px; font-weight:700; font-size:.82rem;
  cursor:pointer; color:#fff; display:flex; align-items:center; gap:6px; font-family:inherit;
  box-shadow:0 6px 14px -6px rgba(0,0,0,.25); transition:transform .1s;
}
.wbtn:active{ transform:scale(.96); }
.wbtn-view{ background:var(--green-mid); }
.wbtn-trace{ background:var(--yellow); }
.wbtn-quiz{ background:var(--red); }

.write-banner{
  margin-top:16px; background:#e4f6e9; border:1.5px solid #67c98a; color:#1a6b3c;
  border-radius:14px; padding:12px 16px; font-weight:700; font-size:.92rem;
  display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap;
}
.write-banner .next-btn{
  background:#1a6b3c; color:#fff; border:none; border-radius:9px; padding:8px 14px;
  font-weight:700; font-size:.82rem; cursor:pointer; font-family:inherit;
}
.write-toast{
  margin-top:14px; font-size:.82rem; color:var(--ink-soft); font-weight:600; min-height:1.2em;
}

.write-nav{ display:flex; align-items:center; justify-content:center; gap:16px; margin-top:22px; }
.write-dots{ display:flex; gap:7px; flex-wrap:wrap; justify-content:center; max-width:260px; }
.write-dot{
  width:11px; height:11px; border-radius:50%; background:var(--line); border:none; cursor:pointer; padding:0;
  transition:.15s;
}
.write-dot.done{ background:#2fa860; }
.write-dot.current{ outline:2.5px solid var(--green-deep); outline-offset:2px; }

.write-summary{ text-align:center; padding:36px 18px; }
.write-summary .emoji{ font-size:2.6rem; }
.write-summary h3{ color:var(--green-deep); font-size:1.35rem; margin:10px 0 4px; }
.write-summary p{ color:var(--ink-soft); font-weight:600; margin:0 0 22px; }
.write-summary button{
  background:var(--green-deep); color:#fff; border:none; border-radius:12px;
  padding:12px 22px; font-weight:700; cursor:pointer; font-size:.9rem; font-family:inherit;
}

/* ============ PART 3: Matching ============ */
.match-progress{ text-align:center; font-weight:700; color:var(--ink-soft); font-size:.85rem; margin-bottom:14px; }
.match-area{ display:grid; }
.match-cols{
  grid-area: 1 / 1;
  display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;
  z-index:2; position:relative;
}
.match-col{ display:flex; flex-direction:column; gap:9px; }
.match-col-label{ font-size:.68rem; font-weight:700; color:var(--ink-soft); text-align:center; text-transform:uppercase; letter-spacing:.04em; margin-bottom:2px; }
.match-item{
  border:1.5px solid var(--line); background:var(--card); border-radius:12px;
  padding:10px 8px; font-size:.86rem; font-weight:600; text-align:center; cursor:pointer;
  transition:.12s; line-height:1.25; min-height:44px; display:flex; align-items:center; justify-content:center;
  position:relative;
}
.match-col:nth-child(1) .match-item{ font-family:'Noto Serif SC',serif; font-size:1.25rem; font-weight:700; color:var(--green-deep); }
.match-item:hover{ border-color:var(--green-soft); }
.match-item.selected{ border-color:var(--green-mid); background:var(--green-pale); box-shadow:0 0 0 3px rgba(63,143,95,.18); }
.match-item.matched{ border-color:#2fa860; background:#e4f6e9; color:#1a6b3c; cursor:default; opacity:.9; }
.match-item.wrong{ border-color:var(--red); background:var(--red-soft); animation:shake .4s; }
@keyframes shake{ 10%,90%{transform:translateX(-2px)} 20%,80%{transform:translateX(3px)} 30%,50%,70%{transform:translateX(-5px)} 40%,60%{transform:translateX(5px)} }
.match-svg{ grid-area: 1 / 1; width:100%; height:100%; pointer-events:none; z-index:1; overflow:visible; }
.match-summary{ text-align:center; padding:30px 18px; }

/* ---------- misc ---------- */
.footer-note{ text-align:center; color:var(--ink-soft); font-size:.76rem; margin-top:46px; }
::-webkit-scrollbar{height:8px;}
::-webkit-scrollbar-thumb{ background:var(--green-soft); border-radius:8px;}

@media (max-width:520px){
  .match-cols{ gap:6px; }
  .match-item{ font-size:.76rem; padding:8px 5px; }
  .match-col:nth-child(1) .match-item{ font-size:1.05rem; }
  .flash-card{ height:260px; }
  .flash-front .fh{ font-size:4.2rem; }
}
</style>
</head>

</script>
<script>
(function(){
"use strict";

const LESSONS = Object.keys(VOCAB);

/* ---------------- progress persistence ---------------- */
const STORAGE_KEY = "lamhoa_hsk_progress_v1";
function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function saveProgress(p){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }catch(e){ /* ignore */ }
}
let PROGRESS = loadProgress(); // { "Bài 1": { done: [wordIndex,...] } }
function getDoneSet(bai){
  if(!PROGRESS[bai]) PROGRESS[bai] = { done: [] };
  return new Set(PROGRESS[bai].done);
}
function markDone(bai, idx){
  const s = getDoneSet(bai);
  s.add(idx);
  PROGRESS[bai].done = Array.from(s);
  saveProgress(PROGRESS);
}
function resetDone(bai){
  PROGRESS[bai] = { done: [] };
  saveProgress(PROGRESS);
}

/* ---------------- app state ---------------- */
const state = {
  bai: LESSONS[0],
  part: 1,
  flashIndex: 0,
  flashFlipped: false,
  writeIndex: 0,
  writer: null,
  matching: null, // populated per render
};

/* ---------------- helpers ---------------- */
function el(html){
  const t = document.createElement("template");
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}
function shuffled(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function speak(text){
  try{
    if(!("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "zh-CN";
    u.rate = 0.85;
    window.speechSynthesis.speak(u);
  }catch(e){ /* ignore */ }
}

/* ---------------- root render ---------------- */
const app = document.getElementById("app");

function render(){
  app.innerHTML = "";
  app.appendChild(renderHeader());
  const page = el(`<div class="page"></div>`);
  page.appendChild(renderLessonNav());
  page.appendChild(renderPartTabs());
  const content = el(`<div class="part-content"></div>`);
  if(state.part === 1) content.appendChild(renderFlashcards());
  if(state.part === 2) content.appendChild(renderWritePractice());
  if(state.part === 3) content.appendChild(renderMatching());
  page.appendChild(content);
  page.appendChild(el(`<p class="footer-note">Hán Ngữ Lâm Hoa · Bộ luyện tập từ vựng HSK 1 (chuẩn 3.0) · Tiến trình luyện viết được lưu tự động trên trình duyệt này</p>`));
  app.appendChild(page);
}

/* ---------------- header ---------------- */
function renderHeader(){
  const header = el(`
  <header class="site-header">
    <div class="header-topbar"></div>
    <img class="watermark-logo" src="data:image/png;base64,${LOGO_GREEN_B64}" alt="">
    <div class="dot-texture"></div>
    <div class="header-inner">
      <div class="header-top-row">
        <img class="brand-logo" src="data:image/png;base64,${LOGO_B64}" alt="Logo Hán Ngữ Lâm Hoa">
        <div class="brand-center">
          <div class="brand-name">Trung tâm Hán Ngữ Lâm Hoa</div>
          <div class="brand-contact">
            <span>✉ Lamhoachinese@gmail.com</span>
            <span class="sep">•</span>
            <span>Zalo/FB: 0913 662 104</span>
          </div>
        </div>
        <div class="brand-qr">
          <img src="data:image/png;base64,${QR_B64}" alt="Mã QR liên hệ">
          <span>Quét theo dõi</span>
        </div>
      </div>
      <div class="header-title-row">
        <h1 class="big-title"><span class="title-line-1">HSK 3.0</span><span class="title-line-2">TỪ VỰNG TỔNG HỢP HSK 2</span></h1>
        <p class="header-subtitle">Thẻ ghi nhớ · Luyện viết chữ Hán · Nối từ — trọn bộ ${LESSONS.length} bài học</p>
      </div>
    </div>
  </header>`);
  return header;
}

/* ---------------- lesson nav ---------------- */
function renderLessonNav(){
  const wrap = el(`<div class="lesson-nav-wrap"><div class="lesson-nav"></div></div>`);
  const nav = wrap.querySelector(".lesson-nav");
  LESSONS.forEach(bai=>{
    const pill = el(`<button type="button" class="lesson-pill${bai===state.bai?" active":""}">${bai}</button>`);
    pill.addEventListener("click", ()=>{
      if(state.bai === bai) return;
      state.bai = bai;
      state.flashIndex = 0; state.flashFlipped = false;
      state.writeIndex = 0;
      render();
    });
    nav.appendChild(pill);
  });
  return wrap;
}

/* ---------------- part tabs ---------------- */
const PART_META = [
  {n:1, title:"Thẻ ghi nhớ", sub:"Lật thẻ học nghĩa"},
  {n:2, title:"Luyện viết", sub:"Tập viết chữ Hán"},
  {n:3, title:"Nối từ", sub:"Nối 3 cột từ vựng"},
];
function renderPartTabs(){
  const wrap = el(`<div class="part-tabs"></div>`);
  PART_META.forEach(p=>{
    const tab = el(`<button type="button" class="part-tab${state.part===p.n?" active":""}"><b>${p.n}. ${p.title}</b><span>${p.sub}</span></button>`);
    tab.addEventListener("click", ()=>{
      if(state.part === p.n) return;
      state.part = p.n;
      state.flashIndex = 0; state.flashFlipped = false;
      state.writeIndex = 0;
      render();
    });
    wrap.appendChild(tab);
  });
  return wrap;
}

/* =====================================================================
   PART 1 — FLASHCARDS
   ===================================================================== */
function renderFlashcards(){
  const words = VOCAB[state.bai];
  if(state.flashIndex >= words.length) state.flashIndex = 0;
  const wrap = el(`<div class="flash-wrap"></div>`);
  wrap.appendChild(el(`<div class="flash-progress">Từ ${state.flashIndex+1} / ${words.length}</div>`));

  const w = words[state.flashIndex];
  const card = el(`
    <div class="flash-card${state.flashFlipped?" flipped":""}">
      <div class="flash-card-inner">
        <div class="flash-face flash-front">
          <button type="button" class="speak-btn" title="Nghe phát âm">🔊</button>
          <div class="fh hanzi-font">${w.hanzi}</div>
          <div class="flash-hint">Chạm để xem phiên âm &amp; nghĩa</div>
        </div>
        <div class="flash-face flash-back">
          <div class="fp">${w.pinyin}</div>
          <div class="fl">${w.loai ? w.loai : "&nbsp;"}</div>
          <div class="fv">${w.nghia}</div>
        </div>
      </div>
    </div>`);
  card.addEventListener("click", (e)=>{
    if(e.target.closest(".speak-btn")) return;
    state.flashFlipped = !state.flashFlipped;
    render();
  });
  card.querySelector(".speak-btn").addEventListener("click", (e)=>{
    e.stopPropagation();
    speak(w.hanzi);
  });
  wrap.appendChild(card);

  const controls = el(`
    <div class="flash-controls">
      <button type="button" class="nav-btn" id="flashPrev" ${state.flashIndex===0?"disabled":""}>‹</button>
      <div class="flash-counter">${state.flashIndex+1}/${words.length}</div>
      <button type="button" class="nav-btn" id="flashNext" ${state.flashIndex===words.length-1?"disabled":""}>›</button>
    </div>`);
  controls.querySelector("#flashPrev").addEventListener("click", ()=>{
    if(state.flashIndex>0){ state.flashIndex--; state.flashFlipped=false; render(); }
  });
  controls.querySelector("#flashNext").addEventListener("click", ()=>{
    if(state.flashIndex<words.length-1){ state.flashIndex++; state.flashFlipped=false; render(); }
  });
  wrap.appendChild(controls);
  return wrap;
}

/* =====================================================================
   PART 2 — WRITING PRACTICE (HanziWriter)
   ===================================================================== */
function renderWritePractice(){
  const words = VOCAB[state.bai];
  const doneSet = getDoneSet(state.bai);

  if(state.writeIndex >= words.length){
    return renderWriteSummary(words, doneSet);
  }

  const wrap = el(`<div class="panel write-wrap"></div>`);
  const w = words[state.writeIndex];
  const idx = state.writeIndex;

  wrap.appendChild(el(`
    <div class="write-meta">
      <div class="write-pinyin">${w.pinyin}${w.loai?`<span class="write-loai">${w.loai}</span>`:""}</div>
      <div class="write-nghia">${w.nghia}</div>
    </div>`));

  const chars = Array.from(w.hanzi).filter(ch => /[\u4e00-\u9fff]/.test(ch));
  const rowId = "writeRow_" + idx;
  const rowWrap = el(`<div class="write-grid-row" id="${rowId}"></div>`);
  const cellEls = chars.map((ch, ci) => {
    const cell = el(`<div class="write-cell"><div class="write-target" id="writeTarget_${idx}_${ci}"></div></div>`);
    rowWrap.appendChild(cell);
    return cell;
  });
  wrap.appendChild(rowWrap);

  const btnRow = el(`
    <div class="write-buttons">
      <button type="button" class="wbtn wbtn-view" id="btnView">▶ Xem nét</button>
      <button type="button" class="wbtn wbtn-trace" id="btnTrace">✏️ Viết mờ</button>
      <button type="button" class="wbtn wbtn-quiz" id="btnQuiz">📝 Tự viết</button>
    </div>`);
  wrap.appendChild(btnRow);

  const toast = el(`<div class="write-toast"></div>`);
  wrap.appendChild(toast);

  const bannerHost = el(`<div></div>`);
  wrap.appendChild(bannerHost);

  // nav + dots
  const nav = el(`
    <div class="write-nav">
      <button type="button" class="nav-btn" id="writePrev" ${idx===0?"disabled":""}>‹</button>
      <div class="write-dots" id="writeDots"></div>
      <button type="button" class="nav-btn" id="writeNext">›</button>
    </div>`);
  const dotsHost = nav.querySelector("#writeDots");
  words.forEach((_, i)=>{
    const dot = el(`<button type="button" class="write-dot${doneSet.has(i)?" done":""}${i===idx?" current":""}" title="Từ ${i+1}"></button>`);
    dot.addEventListener("click", ()=>{ state.writeIndex = i; render(); });
    dotsHost.appendChild(dot);
  });
  nav.querySelector("#writePrev").addEventListener("click", ()=>{
    if(idx>0){ state.writeIndex--; render(); }
  });
  nav.querySelector("#writeNext").addEventListener("click", ()=>{
    state.writeIndex++; render();
  });
  wrap.appendChild(nav);

  // Defer HanziWriter creation until elements are in DOM
  setTimeout(()=>{
    const n = chars.length || 1;
    const rowEl = document.getElementById(rowId);
    if(!rowEl) return;
    const available = Math.min(rowEl.parentElement.clientWidth || 320, 320);
    const gapTotal = 8 * (n - 1);
    let size = Math.floor((available - gapTotal) / n);
    size = Math.max(64, Math.min(size, 260));

    cellEls.forEach(cell=>{ cell.style.width = size + "px"; cell.style.height = size + "px"; });

    const writers = [];
    let loadError = false;
    chars.forEach((ch, ci)=>{
      const target = document.getElementById(`writeTarget_${idx}_${ci}`);
      if(!target) return;
      try{
        const writer = HanziWriter.create(target, ch, {
          width: size,
          height: size,
          padding: 8,
          showCharacter: true,
          showOutline: false,
          strokeAnimationSpeed: 1,
          delayBetweenStrokes: 250,
          strokeColor: "#134429",
          radicalColor: "#b3271e",
          outlineColor: "#d7e3da",
          drawingColor: "#1c5a37",
          drawingWidth: Math.max(14, Math.round(size / 11)),
          highlightColor: "#dd9c2e",
          charDataLoader: function(char, onComplete){
            if(CHAR_DATA[char]) onComplete(CHAR_DATA[char]);
          },
        });
        writers.push(writer);
      }catch(err){
        loadError = true;
      }
    });
    if(loadError || writers.length !== chars.length){
      rowEl.insertAdjacentHTML("afterend", "<p style='color:#b3271e;font-size:.78rem;margin-top:8px;'>Không tải được dữ liệu nét chữ cho một vài chữ trong từ này.</p>");
    }
    state.writer = writers;

    function safeCancelQuiz(){
      writers.forEach(wr=>{ try{ wr.cancelQuiz(); }catch(e){} });
    }

    function startQuiz(showOutline, official){
      safeCancelQuiz();
      toast.textContent = "";
      bannerHost.innerHTML = "";
      let completedCount = 0;
      writers.forEach(wr=>{
        wr.hideCharacter();
        wr.quiz({
          showOutline: showOutline,
          leniency: 1.3,
          showHintAfterMisses: showOutline ? 1 : 3,
          onMistake: function(){},
          onCorrectStroke: function(){},
          onComplete: function(){
            completedCount++;
            if(completedCount < writers.length) return;
            if(official){
              markDone(state.bai, idx);
              dotsHost.children[idx].classList.add("done");
              bannerHost.innerHTML = "";
              const banner = el(`<div class="write-banner">✅ Đã viết xong! <button type="button" class="next-btn">Từ tiếp theo →</button></div>`);
              banner.querySelector(".next-btn").addEventListener("click", ()=>{
                state.writeIndex++; render();
              });
              bannerHost.appendChild(banner);
            } else {
              toast.textContent = 'Tốt lắm! Thử bấm "Tự viết" để hoàn thành từ này nhé.';
            }
          }
        });
      });
    }

    btnRow.querySelector("#btnView").addEventListener("click", ()=>{
      safeCancelQuiz();
      toast.textContent = "";
      bannerHost.innerHTML = "";
      writers.forEach((wr, i)=>{
        wr.hideCharacter();
        setTimeout(()=>{ wr.animateCharacter(); }, i * 60);
      });
    });
    btnRow.querySelector("#btnTrace").addEventListener("click", ()=>{
      startQuiz(true, false);
    });
    btnRow.querySelector("#btnQuiz").addEventListener("click", ()=>{
      startQuiz(false, true);
    });
  }, 0);

  return wrap;
}

function renderWriteSummary(words, doneSet){
  const wrap = el(`<div class="panel write-summary"></div>`);
  wrap.innerHTML = `
    <div class="emoji">🎉</div>
    <h3>Hoàn thành ${state.bai}!</h3>
    <p>Bạn đã luyện viết xong ${doneSet.size}/${words.length} từ vựng</p>
    <button type="button" id="writeRestart">🔄 Luyện lại từ đầu</button>
  `;
  wrap.querySelector("#writeRestart").addEventListener("click", ()=>{
    resetDone(state.bai);
    state.writeIndex = 0;
    render();
  });
  return wrap;
}

/* =====================================================================
   PART 3 — MATCHING (3 columns)
   ===================================================================== */
function renderMatching(){
  const words = VOCAB[state.bai];
  const wrap = el(`<div class="panel"></div>`);
  wrap.appendChild(el(`<div class="match-progress" id="matchProgress">Đã nối: 0/${words.length}</div>`));

  const matchArea = el(`<div class="match-area"></div>`);
  const cols = el(`<div class="match-cols"></div>`);

  const order1 = shuffled(words.map((_,i)=>i));
  const order2 = shuffled(words.map((_,i)=>i));
  const order3 = shuffled(words.map((_,i)=>i));

  function buildCol(label, order, field){
    const colWrap = el(`<div class="match-col"></div>`);
    colWrap.appendChild(el(`<div class="match-col-label">${label}</div>`));
    order.forEach(i=>{
      const item = el(`<div class="match-item hanzi-font" data-id="${i}">${words[i][field]}</div>`);
      colWrap.appendChild(item);
    });
    return colWrap;
  }
  cols.appendChild(buildCol("Chữ Hán", order1, "hanzi"));
  cols.appendChild(buildCol("Phiên âm", order2, "pinyin"));
  cols.appendChild(buildCol("Tiếng Việt", order3, "nghia"));

  const svgNS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(svgNS, "svg");
  svg.setAttribute("class", "match-svg");

  matchArea.appendChild(cols);
  matchArea.appendChild(svg);
  wrap.appendChild(matchArea);

  const summaryHost = el(`<div></div>`);
  wrap.appendChild(summaryHost);

  let selected = {1:null,2:null,3:null};
  let matchedCount = 0;
  const linePairs = []; // {a, b}

  function colOf(item){
    return Array.from(cols.children).findIndex(c=>c.contains(item)) + 1;
  }

  function drawLine(a, b){
    const areaRect = matchArea.getBoundingClientRect();
    const ra = a.getBoundingClientRect();
    const rb = b.getBoundingClientRect();
    const x1 = ra.left + ra.width/2 - areaRect.left;
    const y1 = ra.top + ra.height/2 - areaRect.top;
    const x2 = rb.left + rb.width/2 - areaRect.left;
    const y2 = rb.top + rb.height/2 - areaRect.top;
    const line = document.createElementNS(svgNS, "line");
    line.setAttribute("x1", x1); line.setAttribute("y1", y1);
    line.setAttribute("x2", x2); line.setAttribute("y2", y2);
    line.setAttribute("stroke", "#2fa860");
    line.setAttribute("stroke-width", "3");
    line.setAttribute("stroke-linecap", "round");
    line.setAttribute("opacity", "0.9");
    svg.appendChild(line);
    return line;
  }

  function redrawLines(){
    svg.innerHTML = "";
    linePairs.forEach(p=>drawLine(p.a, p.b));
  }

  function resizeSvg(){
    svg.setAttribute("width", matchArea.clientWidth);
    svg.setAttribute("height", matchArea.clientHeight);
    redrawLines();
  }

  function clearSelection(cls){
    [1,2,3].forEach(c=>{
      if(selected[c]){ selected[c].classList.remove(cls); }
    });
    selected = {1:null,2:null,3:null};
  }

  cols.addEventListener("click", (e)=>{
    const item = e.target.closest(".match-item");
    if(!item || item.classList.contains("matched")) return;
    const c = colOf(item);
    if(selected[c] === item){
      item.classList.remove("selected");
      selected[c] = null;
      return;
    }
    if(selected[c]) selected[c].classList.remove("selected");
    selected[c] = item;
    item.classList.add("selected");

    if(selected[1] && selected[2] && selected[3]){
      const ids = [1,2,3].map(c2=>selected[c2].dataset.id);
      if(ids[0]===ids[1] && ids[1]===ids[2]){
        const a = selected[1], b = selected[2], cItem = selected[3];
        [a,b,cItem].forEach(x=>{ x.classList.remove("selected"); x.classList.add("matched"); });
        linePairs.push({a:a,b:b});
        linePairs.push({a:b,b:cItem});
        redrawLines();
        matchedCount++;
        document.getElementById("matchProgress").textContent = `Đã nối: ${matchedCount}/${words.length}`;
        selected = {1:null,2:null,3:null};
        if(matchedCount === words.length){
          summaryHost.appendChild(el(`
            <div class="match-summary">
              <div style="font-size:2.4rem;">🎉</div>
              <h3 style="color:var(--green-deep);margin:8px 0 4px;">Hoàn thành nối từ ${state.bai}!</h3>
              <p style="color:var(--ink-soft);font-weight:600;margin:0 0 18px;">Chính xác ${matchedCount}/${words.length} từ vựng</p>
              <button type="button" id="matchRestart" style="background:var(--green-deep);color:#fff;border:none;border-radius:12px;padding:12px 22px;font-weight:700;cursor:pointer;font-size:.9rem;">🔄 Làm lại</button>
            </div>`));
          summaryHost.querySelector("#matchRestart").addEventListener("click", render);
        }
      } else {
        [1,2,3].forEach(c2=> selected[c2].classList.add("wrong"));
        setTimeout(()=>{
          [1,2,3].forEach(c2=>{
            if(selected[c2]){ selected[c2].classList.remove("selected","wrong"); }
          });
          selected = {1:null,2:null,3:null};
        }, 550);
      }
    }
  });

  setTimeout(resizeSvg, 0);
  window.addEventListener("resize", resizeSvg);

  return wrap;
}

/* ---------------- boot ---------------- */
render();
})();

</script>
</body>
</html>
